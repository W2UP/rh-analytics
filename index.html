<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RH Analytics - Dashboard</title>

        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-chart-line"></i>
        <span>RH Analytics</span>
      </div>
      <ul class="menu">
        <li class="menu-item active">
          <a href="#"><i class="fa-solid fa-house"></i> Dashboard</a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>Visão Geral</h1>
        <div class="user-profile">
          <i class="fa-solid fa-circle-user"></i>
          <span id="user-name">A carregar...</span>
        </div>
      </header>

      <div class="dashboard-body">
        
        <section class="cards-grid">
          <div class="card">
            <div class="card-icon icon-blue"><i class="fa-solid fa-users"></i></div>
            <div class="card-info">
              <h3>Funcionários</h3>
              <div class="value" id="val-funcionarios">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-green"><i class="fa-solid fa-user-plus"></i></div>
            <div class="card-info">
              <h3>Admissões</h3>
              <div class="value" id="val-admissoes">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-red"><i class="fa-solid fa-user-minus"></i></div>
            <div class="card-info">
              <h3>Desligamentos</h3>
              <div class="value" id="val-desligamentos">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-purple"><i class="fa-solid fa-arrows-rotate"></i></div>
            <div class="card-info">
              <h3>Turnover</h3>
              <div class="value" id="val-turnover">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-yellow"><i class="fa-solid fa-notes-medical"></i></div>
            <div class="card-info">
              <h3>Atestados</h3>
              <div class="value" id="val-atestados">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="card-info">
              <h3>Advertências</h3>
              <div class="value" id="val-advertencias">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-yellow"><i class="fa-solid fa-user-xmark"></i></div>
            <div class="card-info">
              <h3>Faltas</h3>
              <div class="value" id="val-faltas">-</div>
            </div>
          </div>

          <div class="card">
            <div class="card-icon icon-green"><i class="fa-solid fa-cake-candles"></i></div>
            <div class="card-info">
              <h3>Aniversariantes</h3>
              <div class="value" id="val-aniversariantes">-</div>
            </div>
          </div>
        </section>

        <section class="charts-grid">
          <div class="chart-card">
            <h2><i class="fa-solid fa-chart-column"></i> Atestados por Mês</h2>
            <canvas id="chartAtestados"></canvas>
          </div>

          <div class="chart-card">
            <h2><i class="fa-solid fa-chart-line"></i> Evolução do Turnover (%)</h2>
            <canvas id="chartTurnover"></canvas>
          </div>
        </section>

      </div>

      <footer class="footer">
        <span>Última atualização:<strong id="last-update">-</strong></span>
      </footer>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
        
</html>
